name: hrp_ucema

# Conda + pip hybrid: conda for the core scientific stack (with macOS Accelerate
# integration), pip for the long tail. See requirements.txt for pinned versions.

dependencies:
  - python==3.11
  - pip

  # Core scientific
  - numpy>=2.0
  - pandas>=2.2
  - scipy>=1.14
  - matplotlib>=3.9
  - seaborn>=0.13

  # ML / inference
  - scikit-learn>=1.5
  - pytorch>=2.0           # for HRP_Contrastive, HRP_TS2Vec
  - networkx>=3.0          # for HRP_NodeEmbed
  - requests
  - jupyter
  - pytest

  # pip-only packages (not in conda-forge)
  - pip:
    - esig>=1.0            # path signatures for HRP_PathSig
    - node2vec>=0.4        # random-walk embeddings for HRP_NodeEmbed
